name: PWA checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt pytest==9.0.2 streamlit==1.60.0
      - name: Static compile verification
        run: python -m compileall src tools scripts tests
      - name: Build frontend shell
        run: python scripts/build_shell.py
      - name: Run full test suite
        run: python -m pytest --basetemp=.pytest_tmp -q -p no:cacheprovider
      - name: Check JavaScript syntax
        run: |
          for file in public/assets/*.js public/sw.js; do node --check "$file"; done
      - run: git diff --exit-code -- public/checkpoint public/enrollment public/logs public/control
